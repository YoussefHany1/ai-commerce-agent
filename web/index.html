<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>AI Commerce Agent</title>
    <style>
      body {
        font-family: system-ui;
        margin: 0;
        background: #f6f6f6;
        color: #111;
      }
      .wrap {
        max-width: 1000px;
        margin: auto;
        padding: 28px;
      }
      .card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 14px;
        padding: 20px;
        margin: 14px 0;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      input,
      select,
      textarea,
      button {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font: inherit;
      }
      button {
        cursor: pointer;
        background: #111;
        color: #fff;
      }
      .chat {
        min-height: 140px;
        white-space: pre-wrap;
        background: #fafafa;
        padding: 15px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>AI Commerce Agent</h1>
      <p>موظف مبيعات ذكي لمتاجر Shopify وسلة وزد.</p>
      <div class="card">
        <h2>إضافة متجر</h2>
        <div class="row">
          <input id="storeName" placeholder="اسم المتجر" /><select
            id="platform"
          >
            <option>shopify</option>
            <option>salla</option>
            <option>zid</option></select
          ><input id="domain" placeholder="shop.myshopify.com" /><input
            id="token"
            placeholder="Access token"
          /><button onclick="addStore()">إضافة</button>
        </div>
        <p style="font-size: 14px; margin-top: 10px">
          <a
            href="#"
            id="shopifyOauth"
            onclick="
              var domain = document.getElementById('domain').value.trim();
              if (!domain) {
                alert('من فضلك أدخل رابط المتجر (shop.myshopify.com) أولاً');
                return false;
              }
              this.href = '/api/oauth/shopify/start?shop=' + encodeURIComponent(domain);
            "
            >تثبيت عبر Shopify OAuth</a
          >
        </p>
      </div>
      <div class="card">
        <h2>تجربة موظف المبيعات</h2>
        <div class="row">
          <select id="stores"></select
          ><input
            id="msg"
            style="min-width: 300px"
            placeholder="مثال: أبي منتج للبشرة الدهنية"
          /><button onclick="chat()">إرسال</button>
        </div>
        <div id="out" class="chat">—</div>
      </div>
    </div>
    <script>
      async function load() {
        let s = await fetch("/api/stores").then((r) => r.json());
        document.getElementById("stores").innerHTML = s
          .map(
            (x) => `<option value="${x.id}">${x.name} — ${x.platform}</option>`,
          )
          .join("");
      }
      async function addStore() {
        await fetch("/api/stores", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("storeName").value,
            platform: document.getElementById("platform").value,
            shopDomain: document.getElementById("domain").value || undefined,
            accessToken: document.getElementById("token").value || undefined,
          }),
        });
        await load();
      }
      async function chat() {
        let storeId = document.getElementById("stores").value;
        let key = sessionStorage.getItem("admin_api_key") || prompt("ADMIN_API_KEY:");
        if (key) sessionStorage.setItem("admin_api_key", key);
        let s = await fetch("/api/session", {
          method: "POST",
          headers: { "content-type": "application/json", "X-Api-Key": key || "" },
          body: JSON.stringify({ storeId }),
        }).then((r) => r.json());
        if (!s.token) {
          document.getElementById("out").textContent =
            "session failed: " + JSON.stringify(s);
          return;
        }
        let r = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            Authorization: "Bearer " + s.token,
          },
          body: JSON.stringify({
            message: document.getElementById("msg").value,
          }),
        }).then((r) => r.json());
        document.getElementById("out").textContent =
          r.reply || JSON.stringify(r, null, 2);
      }
      load();
    </script>
  </body>
</html>
