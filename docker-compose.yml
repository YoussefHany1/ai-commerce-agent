services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:dca0d688bbb31d3f851502ffcb9c7791387b4fcc544ae434dab41761e5ece317
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ai_commerce_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_commerce_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  redis:
    image: redis:7-alpine@sha256:ca0acbb137c1dc3339c8b147a58fd6f42775d4599327b50e7b116c23de501af2
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment: &db-env
      PGADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ai_commerce_agent
      DATABASE_URL: postgres://${APP_DB_USER:-agent_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}@postgres:5432/ai_commerce_agent
      APP_DB_USER: ${APP_DB_USER:-agent_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *db-env
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    mem_limit: 512m

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # The only build-time input. Privileged variables are runtime-only, so a
        # rebuilt image cannot silently carry a stale secret.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      # Public origin, inlined into the client bundle at build time. Used only for
      # the OAuth install link and the webhook base URL shown to the operator.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      # Server-only: the proxy's upstream target and the credential it attaches.
      API_URL: http://app:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set in .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      # Shared with the app so dashboard cookies can be revoked via the session epoch.
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      # The dashboard is served over plain http in compose, where a browser would
      # refuse to store a Secure cookie. Production keeps it on.
      SESSION_COOKIE_SECURE: "false"
      # Docker populates HOSTNAME with the container's own hostname at start, which
      # would make the Next standalone server bind loopback only. The image's CMD
      # already forces this for the node process; setting it here too keeps the
      # compose contract explicit rather than relying on that.
      HOSTNAME: "0.0.0.0"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m

volumes:
  pgdata: