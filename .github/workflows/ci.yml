name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose + Dockerfiles build
        env:
          POSTGRES_PASSWORD: ci-postgres
          APP_DB_PASSWORD: ci-agent-app
          REDIS_PASSWORD: ci-redis
          NEXT_PUBLIC_API_URL: http://localhost:3000
          # Compose interpolation validates these for every service, so the web
          # image's runtime contract has to be satisfied even though only the build
          # runs here. These are throwaway values, never used to serve traffic.
          # No ADMIN_API_KEY: the dashboard no longer takes one.
          SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY: ci-anon-placeholder-key
        run: |
          docker compose build migrate
          docker compose build app
          docker compose build web
      # Building an image proves nothing about whether it runs. This is the step
      # that would have caught the dashboard binding to loopback only: Docker
      # injects HOSTNAME at container start, so the server bound an address the
      # network could not reach, and the image built cleanly every time.
      - name: Boot the web image and check it is reachable off-loopback
        env:
          SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
          API_URL: http://api.invalid:3000
          REDIS_URL: redis://redis:6379
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY: ci-anon-placeholder-key
        run: |
          set -euo pipefail
          # Resolved from compose so this does not depend on the project-name prefix
          # docker compose happens to apply.
          WEB_IMAGE="$(docker compose images -q web)"
          if [ -z "$WEB_IMAGE" ]; then echo "could not resolve the web image"; exit 1; fi
          # Deliberately no -e HOSTNAME: this must exercise whatever the image
          # and the Docker daemon supply on their own, which is the production case.
          docker run -d --name web-reachability -p 18081:3001 \
            -e SESSION_SECRET -e API_URL -e REDIS_URL -e SUPABASE_URL -e SUPABASE_ANON_KEY \
            "$WEB_IMAGE"
          trap 'docker logs web-reachability; docker rm -f web-reachability' EXIT

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18081/login; then
              echo "web image served /login on the published port"
              exit 0
            fi
            sleep 2
          done

          echo "web image never became reachable on the published port"
          exit 1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (web)
        run: npm ci
        working-directory: web
      - name: Lint + typecheck + test + build (web)
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      # The unit tests cover the allowlist, path normalization, and cookie signing in
      # isolation. What they cannot see is the route's real runtime params — a mismatch
      # there 404s every request while every helper test still passes. This boots the
      # built server against stub Redis/upstream and drives it over HTTP.
      - name: Smoke the BFF end to end
        run: node scripts/smoke-bff.mjs

      # The bundle is the artifact that matters: the dashboard used to hold the admin
      # key in the browser, so a leak here is a full compromise, not a lint nit.
      - name: Audit the client bundle for leaked credentials
        working-directory: web
        run: |
          if grep -rlE 'ADMIN_API_KEY|SESSION_SECRET|SUPABASE_|OPERATOR_PASSWORD_HASH|REDIS_URL|redis://' .next/static; then
            echo "::error::a privileged identifier reached the client bundle"
            exit 1
          fi
          echo "client bundle clean"

      - name: Dependency vulnerability scan (web)
        working-directory: web
        run: npm audit --audit-level=high

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cov

  deploy-plan:
    # render.yaml is only as good as its references: a secret that resolves to
    # nothing, or a value duplicated as both a build arg and a runtime var, deploys
    # green and then fails at runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:render

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:dca0d688bbb31d3f851502ffcb9c7791387b4fcc544ae434dab41761e5ece317
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: ai_commerce_agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_commerce_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ca0acbb137c1dc3339c8b147a58fd6f42775d4599327b50e7b116c23de501af2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGADMIN_URL: postgres://postgres:ci-postgres@localhost:5432/ai_commerce_agent
      DATABASE_URL: postgres://agent_app:ci-agent-app@localhost:5432/ai_commerce_agent
      APP_DB_USER: agent_app
      APP_DB_PASSWORD: ci-agent-app
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_API_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef
      # Production mode refuses to boot without Supabase, because every human
      # credential is verified there. Well-formed throwaway values, so config
      # validation is genuinely exercised rather than skipped. No operator hash:
      # there is no password in this service to compare any more.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-anon-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder-key
      TRUST_PROXY: "none"
      WORKERS_ENABLED: "false"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations + RLS on a clean database
        run: npm run db:migrate && npm run db:apply-rls
      - name: Smoke boot the built server against the migrated DB
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          npm run build
          node dist/server.js &
          SCRIPT_PID=$!
          set +e
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then echo "health OK"; exit 0; fi
            sleep 1
          done
          echo "server failed to become healthy"; kill $SCRIPT_PID 2>/dev/null; exit 1
      - name: Teardown
        run: kill $(jobs -p) 2>/dev/null || true

      - name: Integration tests against migrated DB + Redis (RLS on)
        env:
          TEST_APP_DB_URL: postgres://agent_app:ci-agent-app@localhost:5432/ai_commerce_agent
          TEST_PGADMIN_URL: postgres://postgres:ci-postgres@localhost:5432/ai_commerce_agent
          TEST_REDIS_URL: redis://localhost:6379
        run: npm run test -- src/tests/integration.spec.ts