# Render blueprint for the API and the merchant dashboard.
#
# Before the first deploy
# -----------------------
# 1. The database MUST have pgvector. Render's managed PostgreSQL does not ship the
#    `vector` extension, and the first migration runs
#    `CREATE EXTENSION vector` (drizzle/0001_tiresome_gladiator.sql) with a
#    `vector(1536)` column. Create the database at a provider that does (Neon,
#    Supabase, Timescale) and set DATABASE_URL / PGADMIN_URL to it.
# 2. Set the secrets marked `sync: false`:
#      openssl rand -hex 32     # ADMIN_API_KEY — on agent-api only now, not agent-web;
#                               # ENCRYPTION_KEY
#    SESSION_SECRET is the one secret left on `generateValue`, because only
#    agent-web reads it and so there is no second copy to drift out of sync with.
# 3. Set SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY on agent-api.
#    Every human credential — operator and client — is verified by Supabase, so the
#    API refuses to boot in production without them. agent-web needs SUPABASE_URL
#    and SUPABASE_ANON_KEY only, and must NOT get the service-role key.
# 4. Set API_URL on the web service to the API's private origin (http://agent-api:10000)
#    and OAUTH_REDIRECT_ALLOWLIST to the dashboard's public URL, otherwise the Shopify
#    install dead-ends on a raw JSON response.
# 5. Confirm pgvector is available:  psql $DATABASE_URL -c 'CREATE EXTENSION IF NOT EXISTS vector'
# 6. Apply migration 0012_operators BEFORE the first deploy of the new code — health
#    checks query `operators` — then provision the first one:
#      npm run db:bootstrap      # with PGADMIN_URL pointed at the database
#      npm run operator:create -- --name "Your Name" --email you@example.com
#    There is no OPERATOR_PASSWORD_HASH any more, and no `npm run hash-operator-password`.

# No `databases:` block on purpose. The database must come from a provider that
# ships pgvector, which Render's managed PostgreSQL does not, so it cannot be
# provisioned here — see note 1. If you later switch to a Render Postgres named
# `agent-db`, uncomment the block below and change DATABASE_URL/PGADMIN_URL back to
# `fromDatabase`.
#
#   databases:
#     - name: agent-db
#       databaseName: ai_commerce_agent
#       user: agent
#       plan: 1c-2g
#       postgresMajorVersion: "17"

services:
  # Redis holds the operator session epoch, per-tenant rate limits, customer
  # sessions, OAuth nonces, and the worker leases. Losing it signs operators out
  # and lets two replicas run the same worker until it is restored.
  - type: redis
    name: agent-redis
    ipAllowList: []
    plan: free
    region: oregon

  - type: web
    name: agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    # /api/health answers 200 without a credential, which is what the health
    # check needs; the worker and rate-limit subsystems report their own state.
    healthCheckPath: /api/health
    # NO preDeployCommand. Render rejects the whole Blueprint with
    # "pre-deploy command is not supported for free tier services", and it
    # validates that at sync time, so one such key makes the apply fail
    # outright — the whole blueprint, not just this service. The paid plans
    # (starter and up) support it; `plan: free` does not.
    #
    # Migrations and RLS are therefore an operator step that runs before the
    # deploy, from a machine or CI with the admin connection string:
    #
    #     PGADMIN_URL=postgres://agent_owner:... npm run db:bootstrap
    #
    # `npm run db:bootstrap` = db:migrate + db:apply-rls, and it needs the OWNER
    # role, not DATABASE_URL: it alters policies and creates the app role that
    # the RLS is written for. Render free web services also cannot run one-off
    # jobs, so there is no in-platform way to do this. See DEPLOYMENT.md
    # ("Deploying to Render") for the ordering.
    #
    # The image still ships src/ and tsx, so the same command runs from a shell
    # on the deployed service (`docker run`/`render ssh`, or the Render shell on
    # a paid plan) if you ever need to migrate from Render itself.
    envVars:
      - key: NODE_ENV
        value: production
      # Render terminates TLS and sets X-Forwarded-For, so req.ip must honor it.
      # Leave this as 'none' only if you also disable the edge in front of the API.
      - key: TRUST_PROXY
        value: "1"
      # Every replica schedules the workers; each tick takes a Redis lease, so
      # scale out freely. Set false on a web-only replica.
      - key: WORKERS_ENABLED
        value: "true"
      # External pgvector-capable Postgres, set by hand: see note 1. DATABASE_URL is
      # the RLS-restricted role the app connects as; PGADMIN_URL is the owner role the
      # migration and RLS scripts use to alter policies. They must not be the same
      # account, or RLS protects nothing. PGADMIN_URL is needed off-Render too, for the
      # out-of-band `npm run db:bootstrap` above — keep it somewhere reachable from CI.
      - key: DATABASE_URL
        sync: false # postgres://agent_app:...@host/db?sslmode=require
      - key: PGADMIN_URL
        sync: false # postgres://agent_owner:...@host/db?sslmode=require
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-redis
          property: connectionString
      # Set by hand, to the same value as agent-web's. NOT generateValue: true —
      # agent-web used to take a fromService copy of this, and that copy only
      # refreshes when agent-web is redeployed, so re-applying this Blueprint
      # re-rolled the key here and left the proxy sending one the API rejects.
      # Every operator-guarded route then 401s, and the dashboard reads that as an
      # expired session and bounces the operator back to /login in a loop.
      # scripts/check-render.mjs rejects that generateValue + fromService pairing.
      # Machine callers only (CLI, scripts). The dashboard authenticates with a
      # signed session cookie and never forwards this, so the API key and the
      # browser's credentials are now separate concerns: a leaked browser session
      # is one person's, a leaked API key is the whole install.
      - key: ADMIN_API_KEY
        sync: false
      # Every human credential is verified by Supabase, so production refuses to
      # boot without these three.
      - key: SUPABASE_URL
        sync: false # https://<project-ref>.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      # Privileged. Stays on this service and must never be copied to agent-web.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        # NOT generateValue: true. Render generates an alphanumeric string, but
        # aes-256-gcm needs 32 bytes of hex — Buffer.from(key, 'hex') silently
        # drops non-hex characters, so the app would boot and then fail on the
        # first token write. Set this to the output of `openssl rand -hex 32`.
        sync: false
      # Its own public origin, used to build webhook and OAuth callback URLs. This
      # must be a real URL: src/config.ts validates APP_BASE_URL with z.string().url(),
      # so a bare hostname here would stop the API from booting. Render's `host`
      # property is the private-network hostname with no scheme, which is why this
      # uses the documented self-reference to RENDER_EXTERNAL_URL instead.
      - key: APP_BASE_URL
        fromService:
          type: web
          name: agent-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: OAUTH_REDIRECT_ALLOWLIST
        sync: false # e.g. https://agent-web.onrender.com
      - key: LOG_LEVEL
        value: info
      # Platform credentials — set these from the Render dashboard.
      - key: SHOPIFY_API_VERSION
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false # Stripe price ids for the billing plan tiers (STRIPE_SECRET_KEY must also be set)
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      # OpenRouter fallback: only needed when OpenAI is absent or failing (chat + embeddings).
      - key: OPENROUTER_API_KEY
        sync: false
      # Salla and Zid install flows fail closed (503) without these client credentials.
      - key: SALLA_CLIENT_ID
        sync: false
      - key: SALLA_CLIENT_SECRET
        sync: false
      - key: ZID_CLIENT_ID
        sync: false
      - key: ZID_CLIENT_SECRET
        sync: false

  - type: web
    name: agent-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /login
    envVars:
      # Public origin of the API, inlined into the client bundle at build time and
      # used only for the OAuth link and the webhook display shown in settings.
      # Referenced through RENDER_EXTERNAL_URL because `property: host` is a bare
      # private-network hostname - a browser cannot navigate to it.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: agent-api
          envVarKey: RENDER_EXTERNAL_URL
      # Server-side proxy target. Use the private-network origin so proxied calls
      # skip the public edge:
      #     http://agent-api:10000
      # 10000 is Render's default PORT, which src/server.ts binds to. A Blueprint
      # cannot compose `host` and `port` into one value, so this one is set by hand.
      - key: API_URL
        sync: false
      # Deliberately NO ADMIN_API_KEY here any more. The proxy forwards a verified
      # session id in a header and the API resolves the person behind it, so the web
      # service has no install-wide credential to leak or to drift out of sync.
      # Removing it is the point: two copies of that key across two services is one
      # too many places for a full-privilege secret to live.
      - key: SESSION_SECRET
        generateValue: true
      # The web server completes the flows the browser cannot (PKCE callback,
      # password-reset OTP) and immediately trades the token for a local session id.
      # The public anon key is enough for that. Both are set by hand to match
      # agent-api rather than copied with fromService: a synced copy of a
      # `sync: false` source is an empty value, and scripts/check-render.mjs
      # rejects that pairing for the same reason it did for ADMIN_API_KEY.
      - key: SUPABASE_URL
        sync: false # same value as agent-api's
      - key: SUPABASE_ANON_KEY
        sync: false # same value as agent-api's
      # SUPABASE_SERVICE_ROLE_KEY is deliberately absent and must stay that way: it
      # would let this service read every table and write every auth user.
      # Must be the same Redis the API uses, or a revoked session keeps working.
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-redis
          property: connectionString
