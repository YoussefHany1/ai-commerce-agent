<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Commerce Agent — Analytics</title>
  <style>
    :root {
      --bg: #0f1420; --panel: #171e2e; --panel2: #1e2740; --border: #2a3554;
      --text: #e6ebf5; --muted: #93a0bf; --accent: #5b8cff; --good: #34d399; --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    main { padding: 20px 22px; max-width: 1400px; margin: 0 auto; display: grid; gap: 18px; }
    input, select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font: inherit; }
    button { cursor: pointer; border-color: var(--accent); color: #cfe0ff; }
    button:hover { background: #26365c; }
    label { color: var(--muted); font-size: 12px; margin-right: 6px; }
    #err { color: #f87171; display: none; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .card .v { font-size: 20px; font-weight: 650; margin-top: 4px; }
    .card .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
    .section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .section h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    tr:last-child td { border-bottom: none; }
    td.num, th.num { text-align: right; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; }
    .pill.ok { background: rgba(52,211,153,.15); color: var(--good); }
    .pill.no { background: rgba(148,163,184,.14); color: #cbd5e1; }
    .bar { height: 8px; background: var(--panel2); border-radius: 6px; overflow: hidden; min-width: 120px; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg,#5b8cff,#34d399); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    .muted { color: var(--muted); font-size: 12px; }
    .lag-stats { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 12px; }
    .lag-stats div .k { color: var(--muted); font-size: 11px; }
    .lag-stats div .v { font-size: 18px; font-weight: 650; }
  </style>
</head>
<body>
<header>
  <h1>AI Commerce Agent — Analytics</h1>
  <label for="apikey">API key</label>
  <input id="apikey" type="password" size="24" value="" placeholder="X-Api-Key" />
  <label for="store">Store ID</label>
  <input id="store" size="40" value="" placeholder="uuid" />
  <label for="days">Range</label>
  <select id="days">
    <option value="7">7 days</option>
    <option value="14" selected>14 days</option>
    <option value="30">30 days</option>
    <option value="90">90 days</option>
  </select>
  <button id="go">Load</button>
  <span id="err"></span>
</header>
<main>
  <section class="cards" id="cards"></section>
  <div class="grid2">
    <section class="section">
      <h2>Channels — funnel</h2>
      <table id="sources"><thead><tr>
        <th>Channel</th><th class="num">Recommended</th><th class="num">Clicked</th><th class="num">Converted</th>
        <th class="num">Revenue</th><th class="num">CTR</th><th class="num">CVR</th><th class="num">Avg lag (h)</th>
      </tr></thead><tbody></tbody></table>
    </section>
    <section class="section">
      <h2>Top products</h2>
      <table id="products"><thead><tr>
        <th>Product</th><th class="num">Rec</th><th class="num">Clicked</th><th class="num">Conv</th>
        <th class="num">Revenue</th><th class="num">CVR</th>
      </tr></thead><tbody></tbody></table>
    </section>
  </div>
  <section class="section">
    <h2>Conversion lag</h2>
    <div class="lag-stats" id="lagstats"></div>
    <div id="laglegend" class="muted" style="margin-bottom:10px"></div>
    <table id="lagdaily"><thead><tr>
      <th>Day</th><th class="num">Conversions</th><th class="num">Avg lag (h)</th><th>Distribution</th>
    </tr></thead><tbody></tbody></table>
  </section>
  <section class="section">
    <h2>Attributions <span class="muted">(status)</span>
      <select id="astatus" style="margin-left:8px">
        <option value="">all</option><option value="converted">converted</option>
        <option value="clicked">clicked</option><option value="recommended">recommended</option>
      </select>
    </h2>
    <table id="attributions"><thead><tr>
      <th>Product</th><th>Channel</th><th>Status</th><th class="num">Clicked</th>
      <th class="num">Converted</th><th class="num">Revenue</th>
    </tr></thead><tbody></tbody></table>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const keyEl = $('apikey'), storeEl = $('store'), daysEl = $('days'), errEl = $('err');
  const statusEl = $('astatus');
  const fmtMoney = (n) => Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
  const pct = (n) => (Number(n) * 100).toFixed(1) + '%';
  const hours = (n) => { const h = Number(n); if (h < 1) return Math.round(h * 60) + 'm'; if (h < 24) return h.toFixed(1) + 'h'; return (h / 24).toFixed(1) + 'd'; };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  let allAttributions = [];

  async function get(path) {
    const headers = {};
    const key = keyEl.value.trim();
    const store = storeEl.value.trim();
    if (key) headers['X-Api-Key'] = key;
    if (store) headers['X-Store-Id'] = store;
    const r = await fetch(path, { headers });
    if (!r.ok) {
      let msg = r.statusText;
      try { const j = await r.json(); if (j.error) msg = j.error + (j.planStatus ? ' (' + j.planStatus + ')' : ''); } catch {}
      throw new Error(r.status + ' ' + msg);
    }
    return r.json();
  }

  keyEl.addEventListener('change', () => {
    if (keyEl.value.trim()) localStorage.setItem('store_api_key', keyEl.value.trim());
  });
  storeEl.addEventListener('change', () => {
    if (storeEl.value.trim()) localStorage.setItem('store_id', storeEl.value.trim());
  });
  keyEl.value = localStorage.getItem('store_api_key') ?? '';
  storeEl.value = localStorage.getItem('store_id') ?? '';

  async function load() {
    const store = storeEl.value.trim();
    if (!store) { errEl.style.display = 'inline'; errEl.textContent = 'Store ID required'; return; }
    errEl.style.display = 'none';
    const days = daysEl.value;
    try {
      const [metrics, sources, products, lag, attr] = await Promise.all([
        get('/api/metrics/' + store + '?days=' + days),
        get('/api/analytics/' + store + '/sources'),
        get('/api/analytics/' + store + '/top-products?limit=20'),
        get('/api/analytics/' + store + '/conversion-lag?days=' + days),
        get('/api/analytics/' + store + '/attributions'),
      ]);
      allAttributions = attr.attributions;
      renderCards(metrics.totals);
      renderSources(sources.channels);
      renderProducts(products.products);
      renderLag(lag);
      renderAttributions();
    } catch (e) {
      errEl.style.display = 'inline'; errEl.textContent = 'Error: ' + e.message;
    }
  }

  function card(k, v, sub) {
    return '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + (sub ? ' <small>' + sub + '</small>' : '') + '</div></div>';
  }
  function renderCards(t) {
    const cvr = t.clicked ? t.converted / t.clicked : 0;
    const ctr = t.recommended ? t.clicked / t.recommended : 0;
    $('cards').innerHTML =
      card('Orders', t.orders) + card('Revenue', fmtMoney(t.revenue)) +
      card('Attributed', fmtMoney(t.attributedRevenue)) +
      card('Conversations', t.conversations) + card('Messages', t.messages) +
      card('Recommended', t.recommended) + card('Clicked', t.clicked) + card('Converted', t.converted) +
      card('CTR', pct(ctr)) + card('CVR', pct(cvr));
  }
  function renderSources(rows) {
    $('sources').querySelector('tbody').innerHTML = rows.map((r) =>
      '<tr><td>' + esc(r.channel) + '</td><td class="num">' + r.recommended + '</td><td class="num">' + r.clicked +
      '</td><td class="num">' + r.converted + '</td><td class="num">' + fmtMoney(r.revenue) +
      '</td><td class="num">' + pct(r.ctr) + '</td><td class="num">' + pct(r.cvr) +
      '</td><td class="num">' + hours(r.avgConversionLagHours) + '</td></tr>').join('') ||
      '<tr><td colspan="8" class="muted">No data</td></tr>';
  }
  function renderProducts(rows) {
    $('products').querySelector('tbody').innerHTML = rows.map((r) =>
      '<tr><td>' + esc(r.productTitle) + '</td><td class="num">' + r.recommended + '</td><td class="num">' + r.clicked +
      '</td><td class="num">' + r.converted + '</td><td class="num">' + fmtMoney(r.revenue) +
      '</td><td class="num">' + pct(r.cvr) + '</td></tr>').join('') || '<tr><td colspan="6" class="muted">No data</td></tr>';
  }
  function renderLag(lag) {
    const o = lag.overall;
    $('lagstats').innerHTML =
      '<div><div class="k">Conversions</div><div class="v">' + o.count + '</div></div>' +
      '<div><div class="k">Avg</div><div class="v">' + hours(o.avgHours) + '</div></div>' +
      '<div><div class="k">Median</div><div class="v">' + hours(o.medianHours) + '</div></div>' +
      '<div><div class="k">p90</div><div class="v">' + hours(o.p90Hours) + '</div></div>';
    $('laglegend').innerHTML = lag.distribution.map((b) =>
      '<span style="margin-right:12px">' + esc(b.label) + ': <b>' + b.count + '</b> (' + pct(b.share) + ')</span>').join('');
    const rows = lag.daily.map((d) => {
      const bars = lag.distribution.map((b) => {
        const w = Math.max(2, Math.round((b.count / Math.max(1, o.count)) * 100));
        return '<span class="bar" style="width:14px;display:inline-block;margin-right:2px" title="' + esc(b.label) + ': ' + b.count + '"><i style="width:' + Math.min(100, w) + '%"></i></span>';
      }).join('');
      return '<tr><td>' + esc(d.day) + '</td><td class="num">' + d.conversions + '</td><td class="num">' +
        (d.conversions ? d.avgHours.toFixed(1) + 'h' : '—') + '</td><td>' + bars + '</td></tr>';
    }).join('');
    $('lagdaily').querySelector('tbody').innerHTML = rows || '<tr><td colspan="4" class="muted">No conversions in range</td></tr>';
  }
  function renderAttributions() {
    const status = statusEl.value;
    const list = status ? allAttributions.filter((r) => r.status === status) : allAttributions;
    $('attributions').querySelector('tbody').innerHTML = list.map((r) => {
      const cls = r.status === 'converted' ? 'ok' : 'no';
      return '<tr><td>' + esc(r.productTitle || r.productId) + '</td><td>' + esc(r.channel) + '</td>' +
        '<td><span class="pill ' + cls + '">' + esc(r.status) + '</span></td>' +
        '<td class="num">' + (r.clickedAt ? new Date(r.clickedAt).toLocaleString() : '—') + '</td>' +
        '<td class="num">' + (r.convertedAt ? new Date(r.convertedAt).toLocaleString() : '—') + '</td>' +
        '<td class="num">' + fmtMoney(r.revenue) + '</td></tr>';
    }).join('') || '<tr><td colspan="6" class="muted">No data</td></tr>';
  }

  $('go').addEventListener('click', load);
  storeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  statusEl.addEventListener('change', renderAttributions);
</script>
</body>
</html>
